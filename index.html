<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diwali Night lucky draw: a radiant celebration of light, joy and tonight's winning tickets." />
    <title>Diwali Night Raffle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700;800&family=Yatra+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- shared paints for the marigolds, rangoli details and countdown arc -->
    <svg class="paints" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <radialGradient id="mO" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#ffd98a" />
          <stop offset="0.45" stop-color="#ff9d1f" />
          <stop offset="1" stop-color="#d9520b" />
        </radialGradient>
        <radialGradient id="mY" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#fff6c2" />
          <stop offset="0.45" stop-color="#ffc928" />
          <stop offset="1" stop-color="#e09200" />
        </radialGradient>
        <radialGradient id="mGlow">
          <stop offset="0" stop-color="#fff6cf" stop-opacity="0.95" />
          <stop offset="0.5" stop-color="#ffbe3c" stop-opacity="0.5" />
          <stop offset="1" stop-color="#ff9500" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="arcPaint" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff1b8" />
          <stop offset="0.5" stop-color="#ffb703" />
          <stop offset="1" stop-color="#ff6a00" />
        </linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7cbf3a" />
          <stop offset="1" stop-color="#2f6b1a" />
        </linearGradient>
      </defs>
    </svg>

    <div class="sky" aria-hidden="true">
      <div class="stars" id="stars"></div>
      <div class="ambient-glow"></div>
      <div class="fireworks" id="fireworks"></div>
      <div class="kandils" aria-hidden="true">
        <svg class="kandil kandil-1" viewBox="0 0 80 180">
          <path class="kandil-cord" d="M40 0v27" />
          <path class="kandil-cap" d="M25 27h30l-5 9H30z" />
          <ellipse class="kandil-light" cx="40" cy="79" rx="27" ry="39" />
          <path class="kandil-body" d="M40 34 68 66l-9 52-19 15-19-15-9-52z" />
          <path class="kandil-panel" d="m40 49 13 28-13 31-13-31z" />
          <path class="kandil-panel" d="M19 68h42M23 112h34" />
          <path class="kandil-fringe" d="m21 118 7 20 6-12 6 20 6-20 6 12 7-20" />
          <path class="kandil-tail" d="M40 132v40m-12-38-5 29m29-29 5 29" />
        </svg>
        <svg class="kandil kandil-2" viewBox="0 0 80 180">
          <path class="kandil-cord" d="M40 0v24" />
          <path class="kandil-cap" d="M23 24h34l-6 10H29z" />
          <ellipse class="kandil-light" cx="40" cy="77" rx="28" ry="40" />
          <path class="kandil-body" d="M40 32 69 63l-7 51-22 18-22-18-7-51z" />
          <path class="kandil-panel" d="m40 47 15 27-15 33-15-33z" />
          <path class="kandil-panel" d="M17 65h46m-42 45h38" />
          <path class="kandil-fringe" d="m18 114 8 23 7-12 7 22 7-22 7 12 8-23" />
          <path class="kandil-tail" d="M40 131v42m-14-38-6 28m34-28 6 28" />
        </svg>
        <svg class="kandil kandil-3" viewBox="0 0 80 180">
          <path class="kandil-cord" d="M40 0v24" />
          <path class="kandil-cap" d="M23 24h34l-6 10H29z" />
          <ellipse class="kandil-light" cx="40" cy="77" rx="28" ry="40" />
          <path class="kandil-body" d="M40 32 69 63l-7 51-22 18-22-18-7-51z" />
          <path class="kandil-panel" d="m40 47 15 27-15 33-15-33z" />
          <path class="kandil-panel" d="M17 65h46m-42 45h38" />
          <path class="kandil-fringe" d="m18 114 8 23 7-12 7 22 7-22 7 12 8-23" />
          <path class="kandil-tail" d="M40 131v42m-14-38-6 28m34-28 6 28" />
        </svg>
        <svg class="kandil kandil-4" viewBox="0 0 80 180">
          <path class="kandil-cord" d="M40 0v27" />
          <path class="kandil-cap" d="M25 27h30l-5 9H30z" />
          <ellipse class="kandil-light" cx="40" cy="79" rx="27" ry="39" />
          <path class="kandil-body" d="M40 34 68 66l-9 52-19 15-19-15-9-52z" />
          <path class="kandil-panel" d="m40 49 13 28-13 31-13-31z" />
          <path class="kandil-panel" d="M19 68h42M23 112h34" />
          <path class="kandil-fringe" d="m21 118 7 20 6-12 6 20 6-20 6 12 7-20" />
          <path class="kandil-tail" d="M40 132v40m-12-38-5 29m29-29 5 29" />
        </svg>
      </div>
      <svg class="horizon" viewBox="0 0 1600 320" preserveAspectRatio="none">
        <ellipse class="haze" cx="800" cy="292" rx="760" ry="130" />
        <path class="roof-glow" d="M270 219l85-66 85 66M594 225l112-98 112 98M1142 218l92-72 92 72" />
        <path class="skyline" d="M0 320V266h80v-34h54v34h86v-47h30l105-82 105 82h30v47h77v-41h45l94-112 94 112h45v41h82v-48h30l107-86 107 86h30v48h91v-38h62v38h76v54H0zm318-101h74l-37-39-37 39zm349 6h78l-39-51-39 51zm528-7h78l-39-43-39 43z" />
      </svg>
      <div class="horizon-lamps" aria-hidden="true">
        <span class="roof-diya" style="--x:7%;--y:34%;--delay:-0.2s"></span>
        <span class="roof-diya" style="--x:14%;--y:46%;--delay:-0.8s"></span>
        <span class="roof-diya" style="--x:22%;--y:27%;--delay:-1.3s"></span>
        <span class="roof-diya" style="--x:30%;--y:43%;--delay:-1.9s"></span>
        <span class="roof-diya" style="--x:70%;--y:43%;--delay:-1.1s"></span>
        <span class="roof-diya" style="--x:78%;--y:27%;--delay:-1.7s"></span>
        <span class="roof-diya" style="--x:86%;--y:46%;--delay:-0.5s"></span>
        <span class="roof-diya" style="--x:93%;--y:34%;--delay:-2.2s"></span>
      </div>
    </div>

    <svg class="garland" id="garland" aria-hidden="true"></svg>
    <div class="diya-corner diya-left" aria-hidden="true"></div>
    <div class="diya-corner diya-right" aria-hidden="true"></div>

    <main class="stage">
      <header class="masthead">
        <h1><span class="t1">Diwali Night</span><span class="t2">Lucky Draw</span></h1>
        <div class="rangoli-rule" aria-hidden="true"></div>
      </header>

      <section class="medallion-wrap" aria-label="Draw">
        <div class="medallion" id="medallion">
          <svg class="mala" id="mala" viewBox="-240 -240 480 480" aria-hidden="true"></svg>
          <div class="face">
            <p class="face-label" id="faceLabel">Winning Number</p>
            <div class="number" id="winnerDisplay"></div>
          </div>
          <div class="countdown" id="countdown" aria-hidden="true"><span id="countdownValue">10</span></div>
        </div>
      </section>

      <div class="controls">
        <button id="drawButton" class="draw-button" type="button">Start Draw</button>
        <button id="resetButton" class="secondary-button" type="button">Reset</button>
      </div>
      <p id="statusText" class="status-text" role="status" aria-live="polite"></p>
      <ol class="winners" id="winnersList" aria-label="Winners so far"></ol>
    </main>

    <!-- raffle setup: a card over the page, so it never pushes the draw off screen -->
    <section class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
      <div class="settings-card">
        <h2 id="setupTitle">Raffle setup</h2>
        <div class="settings-grid">
          <label class="field">
            <span>First ticket</span>
            <input id="startNumber" type="number" inputmode="numeric" step="1" value="4504231" />
          </label>
          <label class="field">
            <span>Last ticket</span>
            <input id="endNumber" type="number" inputmode="numeric" step="1" value="4504631" />
          </label>
          <label class="field">
            <span>Spin time</span>
            <select id="spinTime">
              <option value="6">6 seconds</option>
              <option value="10" selected>10 seconds</option>
              <option value="15">15 seconds</option>
              <option value="20">20 seconds</option>
            </select>
          </label>
          <label class="field check">
            <input id="noRepeat" type="checkbox" checked />
            <span>Never draw the same ticket twice</span>
          </label>
        </div>
        <div class="settings-foot">
          <p class="hint">Space or Enter: start · S: setup · F: full screen · M: mute</p>
          <button id="hideSettings" class="hide-button" type="button">Done</button>
        </div>
      </div>
    </section>

    <div class="tools">
      <button id="soundButton" class="tool" type="button" aria-label="Mute countdown sound" aria-pressed="false" title="Mute (M)">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" /><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" /><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /></svg>
      </button>
      <button id="fullscreenButton" class="tool" type="button" aria-label="Full screen" title="Full screen (F)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <button id="settingsButton" class="tool" type="button" aria-label="Settings" aria-controls="settings" aria-expanded="true" title="Hide settings (S)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z" fill="none" stroke="currentColor" stroke-width="1.8" /><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.5-2.4 1a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.5 7.5 0 0 0 7 6.5l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.5 2.4-1a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.4 1 2-3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" /></svg>
      </button>
    </div>

    <div id="confettiLayer" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
